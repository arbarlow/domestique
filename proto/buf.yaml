version: v2
modules:
  - path: .
lint:
  use:
    - DEFAULT
  except:
    # the Domestique protocol frames are not gRPC services; request/response naming rules don't apply.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
