// Domestique protocol v1: the protocol between Domestique clients and servers.
//
// Transport: one WebSocket per client, binary messages only. Each WebSocket message is exactly one
// ClientFrame (client -> server) or ServerFrame (server -> client). The same framing runs over a
// Unix socket (local Mac) and TCP/TLS (servers).
//
// Rules for changing this file: additive changes only (new fields, new oneof arms, new enum values).
// `buf breaking` enforces it. A breaking change means a new package, domestique.v2.
syntax = "proto3";

package domestique.v1;

option go_package = "github.com/arbarlow/domestique/server/gen/domestique/v1;domestiquev1";
option swift_prefix = "Proto_";

// ---------------------------------------------------------------------------------------------
// Frames
// ---------------------------------------------------------------------------------------------

message ClientFrame {
  oneof frame {
    // Must be the first frame on a connection.
    Hello hello = 1;
    Request request = 2;
    Ping ping = 3;
  }
}

message ServerFrame {
  oneof frame {
    // Answer to Hello. Sent exactly once, first.
    Welcome welcome = 1;
    Response response = 2;
    Event event = 3;
    // The server dropped a subscription (slow consumer, or the stream ended). Resubscribe from
    // `resume_seq` to catch up.
    Gap gap = 4;
    Pong pong = 5;
    // The server is closing the connection (bad token, protocol mismatch, shutdown).
    Goodbye goodbye = 6;
  }
}

// The current protocol version. Bumped only for behaviour changes that capabilities can't express.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_1 = 1;
}

message Hello {
  ProtocolVersion protocol_version = 1;
  // Stable per client install. Lets the server tell reconnects from new clients.
  string client_id = 2;
  // Human readable, e.g. "Domestique for Mac 0.4.0".
  string client_name = 3;
  // Bearer token. Optional on a Unix socket, required on TCP.
  string token = 4;
  // Optional features the client understands, e.g. "zstd".
  repeated string capabilities = 5;
}

message Welcome {
  ProtocolVersion protocol_version = 1;
  // Stable id of this server (persisted on first start).
  string server_id = 2;
  string server_name = 3;
  string server_version = 4;
  repeated string capabilities = 5;
  // What the presented token (or the Unix socket) allows.
  TokenScope scope = 6;
}

message Goodbye {
  ErrorCode code = 1;
  string message = 2;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

message Gap {
  uint64 subscription_id = 1;
  // Resubscribe with this cursor (session streams). 0 for snapshot streams.
  uint64 resume_seq = 2;
  string reason = 3;
}

// ---------------------------------------------------------------------------------------------
// Requests and responses
// ---------------------------------------------------------------------------------------------

message Request {
  // Chosen by the client, unique per connection. Echoed in the Response.
  uint64 id = 1;
  // Optional. Requests that create things (CreateWorkspace, OpenSession, SendMessage) with the same
  // key within 10 minutes return the original result instead of running twice.
  string idempotency_key = 2;

  oneof command {
    GetServerInfo get_server_info = 10;
    Subscribe subscribe = 11;
    Unsubscribe unsubscribe = 12;

    ListRepositories list_repositories = 20;
    AddRepository add_repository = 21;
    RemoveRepository remove_repository = 22;

    ListWorkspaces list_workspaces = 30;
    CreateWorkspace create_workspace = 31;
    ArchiveWorkspace archive_workspace = 32;
    DeleteWorkspace delete_workspace = 33;
    ImportWorkspace import_workspace = 34;

    OpenSession open_session = 40;
    CloseSession close_session = 41;
    SendMessage send_message = 42;
    Interrupt interrupt = 43;
    RespondApproval respond_approval = 44;
    AnswerQuestion answer_question = 45;
    UpdateSession update_session = 46;
    ListModels list_models = 47;
    GetTranscript get_transcript = 48;
    ReopenSession reopen_session = 49;

    GetDiff get_diff = 60;
    ListFiles list_files = 61;
    ReadFile read_file = 62;

    // Sandbox providers and their sandboxes (see "Sandboxes" below).
    ListSandboxProviders list_sandbox_providers = 80;
    SaveSandboxProvider save_sandbox_provider = 81;
    RemoveSandboxProvider remove_sandbox_provider = 82;
    ListSandboxes list_sandboxes = 83;
    GetSandbox get_sandbox = 84;
    CreateSandbox create_sandbox = 85;
    ChangeSandbox change_sandbox = 86;
    OpenSandboxAccess open_sandbox_access = 87;

    // MCP servers handed to agents (see "MCP servers" below).
    ListMcpServers list_mcp_servers = 100;
    SaveMcpServer save_mcp_server = 101;
    RemoveMcpServer remove_mcp_server = 102;
    ResolveMcpConfig resolve_mcp_config = 103;

    // Running processes (see ProcessTarget).
    ProcessInput process_input = 50;
    ResizeProcess resize_process = 51;
    SignalProcess signal_process = 52;

    CreateToken create_token = 90;
    ListTokens list_tokens = 91;
    RevokeToken revoke_token = 92;
  }

  // Reserved for later phases: ship (70-79), sandboxes (89).
  reserved 70 to 79, 89;
}

message Response {
  uint64 id = 1;

  oneof result {
    Error error = 2;
    Empty empty = 3;
    ServerInfo server_info = 10;
    SubscribeResult subscribe = 11;
    RepositoryList repositories = 20;
    Repository repository = 21;
    WorkspaceList workspaces = 30;
    Workspace workspace = 31;
    Session session = 40;
    ModelList models = 47;
    TranscriptPage transcript = 48;
    Diff diff = 60;
    FileList files = 61;
    FileContent file = 62;
    CreatedToken created_token = 90;
    TokenList tokens = 91;
    SandboxProviderList sandbox_providers = 80;
    SandboxProvider sandbox_provider = 81;
    SandboxList sandboxes = 83;
    Sandbox sandbox = 84;
    SandboxAccess sandbox_access = 87;
    McpServerList mcp_servers = 100;
    McpServer mcp_server = 101;
    McpConfig mcp_config = 103;
  }
}

message Empty {}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_UNAUTHENTICATED = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  ERROR_CODE_FAILED_PRECONDITION = 5;
  ERROR_CODE_UNAVAILABLE = 6;
  ERROR_CODE_INTERNAL = 7;
  ERROR_CODE_UNIMPLEMENTED = 8;
  ERROR_CODE_PROTOCOL = 9;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------------------------
// Server
// ---------------------------------------------------------------------------------------------

message GetServerInfo {}

message ServerInfo {
  string server_id = 1;
  string server_name = 2;
  string server_version = 3;
  // "darwin/arm64", "linux/amd64", ...
  string platform = 4;
  // Where worktrees live on this host.
  string workspaces_root = 5;
  // Which agent CLIs were found on this host.
  repeated Provider providers = 6;
  // Sandbox services this server can create workspaces' machines on (no account details).
  repeated SandboxProvider sandbox_providers = 7;
  // Connections on the trusted local listener, the asking client included. 0 from older servers.
  uint32 local_clients = 8;
}

// ---------------------------------------------------------------------------------------------
// Subscriptions
// ---------------------------------------------------------------------------------------------

message Subscribe {
  oneof target {
    // Repositories, workspaces and sessions on this server. Starts with a ServerSnapshot.
    ServerTarget server = 1;
    // One session's transcript and live activity.
    SessionTarget session = 2;
    // Starts a process and streams its output: ProcessStarted, then ProcessOutput chunks, then
    // ProcessExited. Needs the OPERATE scope. The process belongs to this subscription: unsubscribing
    // or disconnecting hangs it up (SIGHUP to its process group, then SIGKILL), like ssh.
    ProcessTarget process = 3;
  }
}

message ProcessTarget {
  // Optional: run inside this workspace (relative cwd resolves against it; its environment, e.g.
  // DOMESTIQUE_PORT, is added).
  string workspace_id = 1;
  // Absolute, or relative to the workspace. Default: the workspace, else the server's home directory.
  string cwd = 2;
  // Exactly one of argv (executable resolved on PATH) or shell (a script run with the server user's
  // shell, `-c`).
  repeated string argv = 3;
  string shell = 4;
  // Added on top of the server's environment (and the workspace's).
  map<string, string> env = 5;
  // Run on a pseudo-terminal: stdout and stderr arrive merged as STDOUT, input is raw.
  bool tty = 6;
  uint32 cols = 7;
  uint32 rows = 8;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

message ProcessStarted {
  // Use with ProcessInput / ResizeProcess / SignalProcess.
  string process_id = 1;
  int32 pid = 2;
}

// Output is never dropped: a slow client slows the process down (backpressure), it doesn't lose bytes.
message ProcessOutput {
  OutputStream stream = 1;
  bytes data = 2;
}

message ProcessExited {
  // -1 when killed by a signal.
  int32 exit_code = 1;
  // The signal that killed it, if any (e.g. 9, 15).
  int32 signal = 2;
  // Set when the process couldn't start at all (exit_code is then 127).
  string error = 3;
}

message ProcessInput {
  string process_id = 1;
  bytes data = 2;
  // Close the process's stdin after data.
  bool eof = 3;
}

message ResizeProcess {
  string process_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message SignalProcess {
  string process_id = 1;
  // POSIX signal number, sent to the process group (e.g. 2 INT, 15 TERM, 9 KILL).
  int32 signal = 2;
}

message ServerTarget {}

message SessionTarget {
  string session_id = 1;
  // Replay every transcript item persisted after this cursor (0 = from the start), then go live.
  // Replayed items arrive in display (creation) order; each event's seq is that item's last
  // write, and ReplayDone carries the highest seq of the replay.
  uint64 from_seq = 2;
  // Coalesce AppendText events for at most this long. 0 = server default (33 ms).
  uint32 coalesce_ms = 3;
}

message SubscribeResult {
  uint64 subscription_id = 1;
}

message Unsubscribe {
  uint64 subscription_id = 1;
}

message Event {
  uint64 subscription_id = 1;
  // Session streams: the latest persisted transcript seq this event is consistent with. Store the
  // highest you have seen and resubscribe with it. Snapshot streams: a per-subscription counter.
  uint64 seq = 2;

  oneof payload {
    // Server stream.
    ServerSnapshot server_snapshot = 10;
    Repository repository_upserted = 11;
    string repository_removed = 12;
    Workspace workspace_upserted = 13;
    string workspace_removed = 14;
    Session session_upserted = 15;
    string session_removed = 16;

    // Session stream.
    TranscriptItem item_upserted = 30;
    AppendText append_text = 31;
    TurnStarted turn_started = 32;
    TurnEnded turn_ended = 33;
    StatusLine status = 34;
    AgentTask task = 35;
    RateLimit rate_limit = 36;
    AgentExited exited = 37;
    AutoTurnStarted auto_turn_started = 38;
    ModelList models = 39;
    // Sent once after replay finishes; everything after is live.
    ReplayDone replay_done = 40;

    // Process stream.
    ProcessStarted process_started = 50;
    ProcessOutput process_output = 51;
    ProcessExited process_exited = 52;
  }
}

message ServerSnapshot {
  repeated Repository repositories = 1;
  repeated Workspace workspaces = 2;
  repeated Session sessions = 3;
}

message AppendText {
  string item_id = 1;
  string delta = 2;
}

message TurnStarted {}

message TurnEnded {
  TurnSummary summary = 1;
}

message StatusLine {
  // Empty clears the status.
  string text = 1;
}

message AgentExited {
  string message = 1;
}

message AutoTurnStarted {
  string reason = 1;
}

message ReplayDone {}

// ---------------------------------------------------------------------------------------------
// Repositories and workspaces
// ---------------------------------------------------------------------------------------------

enum ShipMode {
  SHIP_MODE_UNSPECIFIED = 0;
  SHIP_MODE_PULL_REQUEST = 1;
  SHIP_MODE_TRUNK = 2;
}

message Repository {
  string id = 1;
  // Folder-safe name, used in worktree paths.
  string name = 2;
  // Path of the clone on the server's host.
  string path = 3;
  string remote_url = 4;
  string default_branch = 5;
  ShipMode ship_mode = 6;
  int64 created_at_ms = 7;
  string display_name = 8;
}

message RepositoryList {
  repeated Repository repositories = 1;
}

message ListRepositories {}

message AddRepository {
  // Exactly one of path (an existing clone on the server's host) or clone_url.
  string path = 1;
  string clone_url = 2;
  // Optional folder name for clone_url. Defaults to the repo name from the URL.
  string name = 3;
  // Optional client-chosen id (a UUID). Lets clients keep their own ids when they hand a repository
  // over to a server. Ignored when the repository is already registered.
  string id = 4;
}

message RemoveRepository {
  string repository_id = 1;
}

enum WorkspaceState {
  WORKSPACE_STATE_UNSPECIFIED = 0;
  WORKSPACE_STATE_CREATING = 1;
  WORKSPACE_STATE_SETTING_UP = 2;
  WORKSPACE_STATE_READY = 3;
  WORKSPACE_STATE_FAILED = 4;
  WORKSPACE_STATE_ARCHIVED = 5;
}

message Workspace {
  string id = 1;
  string repository_id = 2;
  // Short human name, e.g. "galibier". Also the worktree directory name.
  string name = 3;
  string branch = 4;
  string path = 5;
  string base_branch = 6;
  string base_commit = 7;
  // First of 10 consecutive ports reserved for this workspace (DOMESTIQUE_PORT).
  int32 port_base = 8;
  WorkspaceState state = 9;
  // Set when state is FAILED.
  string failure = 10;
  int64 created_at_ms = 11;
  int32 pr_number = 12;
  string pr_url = 13;
  bool has_unread = 14;
}

message WorkspaceList {
  repeated Workspace workspaces = 1;
}

message ListWorkspaces {
  // Optional filter.
  string repository_id = 1;
  bool include_archived = 2;
}

message CreateWorkspace {
  string repository_id = 1;
  // Optional; a cycling-themed name is picked when empty.
  string name = 2;
  // Optional; the repository's default branch when empty.
  string base_branch = 3;
  // Optional first prompt, sent once the workspace is ready.
  string prompt = 4;
  // Optional session to open with the workspace (always opened when set, even without a prompt).
  // When a prompt is given and this is unset, a default session is opened.
  OpenSession session = 5;
  // Optional client-chosen workspace id (a UUID).
  string id = 6;
  // Optional branch name. Default: "<branch_prefix>/<name>".
  string branch = 7;
  // Don't run domestique.toml's [setup] (the client runs it itself, e.g. to show its output).
  bool skip_setup = 8;
}

message ArchiveWorkspace {
  string workspace_id = 1;
  // Also delete the local branch.
  bool delete_branch = 2;
  // Don't run domestique.toml's [archive] script (the client already did).
  bool skip_archive_script = 3;
}

// Forgets an archived workspace: its sessions and transcripts are deleted.
message DeleteWorkspace {
  string workspace_id = 1;
  // Also delete the local branch.
  bool delete_branch = 2;
}

// Registers a workspace that already exists on the server's host (e.g. a worktree a client created
// before it used a server), with its sessions and their transcripts. Ids are kept. Idempotent: an
// existing workspace is returned unchanged.
message ImportWorkspace {
  // id, repository_id, name, branch, path, base_branch, base_commit, port_base, state and
  // created_at_ms are used. CREATING / SETTING_UP are stored as READY.
  Workspace workspace = 1;
  repeated ImportSession sessions = 2;
}

message ImportSession {
  // id, title, provider, model, effort, permission_mode, provider_session_id and created_at_ms are used.
  Session session = 1;
  // In display order.
  repeated TranscriptItem items = 2;
}

// ---------------------------------------------------------------------------------------------
// Sessions (agent conversations, shown as chat tabs)
// ---------------------------------------------------------------------------------------------

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_CLAUDE = 1;
  PROVIDER_CODEX = 2;
}

// How much the agent may do without asking.
enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0;
  // Never ask (Claude bypassPermissions, Codex never + danger-full-access). Default.
  PERMISSION_MODE_BYPASS = 1;
  // The provider's own reviewer decides.
  PERMISSION_MODE_AUTO = 2;
  // Every risky action becomes an approval request.
  PERMISSION_MODE_ASK = 3;
}

enum SessionActivity {
  SESSION_ACTIVITY_UNSPECIFIED = 0;
  SESSION_ACTIVITY_IDLE = 1;
  SESSION_ACTIVITY_RUNNING = 2;
  // A turn is running and waiting on an approval or question.
  SESSION_ACTIVITY_AWAITING_INPUT = 3;
}

message Session {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  Provider provider = 4;
  // Empty = provider default.
  string model = 5;
  string effort = 6;
  PermissionMode permission_mode = 7;
  // Claude session id / Codex thread id, used to resume.
  string provider_session_id = 8;
  int64 created_at_ms = 9;
  SessionActivity activity = 10;
  // Highest persisted transcript seq.
  uint64 last_seq = 11;
  string status = 12;
  // Set while the session is closed with its history kept. Closed sessions aren't listed or streamed.
  int64 closed_at_ms = 13;
}

message OpenSession {
  // Ignored inside CreateWorkspace.
  string workspace_id = 1;
  Provider provider = 2;
  string model = 3;
  string effort = 4;
  PermissionMode permission_mode = 5;
  string title = 6;
  // Optional client-chosen session id (a UUID). Must not belong to an open session.
  string id = 7;
}

message CloseSession {
  string session_id = 1;
  // Keep the transcript so ReopenSession can bring the session back. It's kept until the workspace
  // is archived or deleted. Otherwise the session and its history are deleted.
  bool keep_history = 2;
}

// Brings back a session closed with keep_history, with its transcript and agent session.
message ReopenSession {
  string session_id = 1;
}

message Attachment {
  bytes data = 1;
  string media_type = 2;
  string filename = 3;
}

message SendMessage {
  string session_id = 1;
  string text = 2;
  repeated Attachment attachments = 3;
}

message Interrupt {
  string session_id = 1;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_APPROVE = 1;
  DECISION_APPROVE_FOR_SESSION = 2;
  DECISION_DENY = 3;
}

message RespondApproval {
  string session_id = 1;
  string request_id = 2;
  Decision decision = 3;
  // Optional reason, sent to the agent on DENY.
  string message = 4;
}

message AnswerQuestion {
  string session_id = 1;
  string request_id = 2;
  // Keyed by question id.
  map<string, string> answers = 3;
}

message UpdateSession {
  string session_id = 1;
  optional string model = 2;
  optional string effort = 3;
  optional PermissionMode permission_mode = 4;
  optional string title = 5;
}

message ListModels {
  Provider provider = 1;
}

message ModelOption {
  string id = 1;
  string display_name = 2;
  string description = 3;
  repeated string efforts = 4;
  string default_effort = 5;
  bool is_default = 6;
}

message ModelList {
  repeated ModelOption models = 1;
}

// Pull-style transcript paging, for clients that don't want a live subscription.
message GetTranscript {
  string session_id = 1;
  uint64 after_seq = 2;
  // 0 = server default (500).
  uint32 limit = 3;
}

message TranscriptPage {
  repeated TranscriptEntry entries = 1;
  // Pass as after_seq to get the next page. Equal to the request's after_seq when there's nothing new.
  uint64 next_seq = 2;
  bool has_more = 3;
}

message TranscriptEntry {
  // Last write. Pages are ordered by seq.
  uint64 seq = 1;
  TranscriptItem item = 2;
  // Creation order: display items sorted by this. (An item rewritten later, e.g. when streamed
  // text is persisted, gets a new seq but keeps its position.)
  uint64 position = 3;
}

// ---------------------------------------------------------------------------------------------
// Transcript
// ---------------------------------------------------------------------------------------------

message TranscriptItem {
  string id = 1;
  int64 timestamp_ms = 2;

  oneof kind {
    string user = 10;
    // Markdown from the agent.
    string assistant = 11;
    string reasoning = 12;
    ToolCall tool = 13;
    ApprovalRequest approval = 14;
    string notice = 15;
    string error = 16;
    TurnSummary turn_summary = 17;
    // A turn the agent started on its own (e.g. a background subagent finished).
    string trigger = 18;
  }
}

enum ToolStatus {
  TOOL_STATUS_UNSPECIFIED = 0;
  TOOL_STATUS_RUNNING = 1;
  TOOL_STATUS_COMPLETED = 2;
  TOOL_STATUS_FAILED = 3;
  TOOL_STATUS_DECLINED = 4;
}

message ToolCall {
  // Normalised: "Bash", "Read", "Edit", "Write", "Grep", "WebSearch", "MCP", "Task", ...
  string name = 1;
  // One line, e.g. the command or the file path.
  string summary = 2;
  // Full input rendered as text (JSON or command).
  string input = 3;
  string output = 4;
  ToolStatus status = 5;
  repeated FileChange file_changes = 6;
  // The agent's own short description of the call (Claude's Bash `description`), when it gives one.
  string description = 7;
}

message FileChange {
  string path = 1;
  // Unified diff.
  string diff = 2;
}

enum ApprovalResolution {
  APPROVAL_RESOLUTION_UNSPECIFIED = 0;
  APPROVAL_RESOLUTION_PENDING = 1;
  APPROVAL_RESOLUTION_APPROVED = 2;
  APPROVAL_RESOLUTION_APPROVED_FOR_SESSION = 3;
  APPROVAL_RESOLUTION_DENIED = 4;
  APPROVAL_RESOLUTION_ANSWERED = 5;
  APPROVAL_RESOLUTION_CANCELLED = 6;
}

message ApprovalRequest {
  // The provider's request id; pass it to RespondApproval / AnswerQuestion.
  string request_id = 1;
  string title = 2;
  string detail = 3;
  ApprovalResolution resolution = 4;
  // Non-empty = a question for the user (answer with AnswerQuestion) rather than a yes/no approval.
  repeated AgentQuestion questions = 5;
  map<string, string> answers = 6;
}

message AgentQuestion {
  string id = 1;
  string header = 2;
  string question = 3;
  repeated QuestionOption options = 4;
  bool multi_select = 5;
}

message QuestionOption {
  string label = 1;
  string description = 2;
}

message TurnSummary {
  optional int64 duration_ms = 1;
  optional double cost_usd = 2;
  optional int64 input_tokens = 3;
  optional int64 output_tokens = 4;
  bool is_error = 5;
  string message = 6;
}

enum AgentTaskStatus {
  AGENT_TASK_STATUS_UNSPECIFIED = 0;
  AGENT_TASK_STATUS_RUNNING = 1;
  AGENT_TASK_STATUS_COMPLETED = 2;
  AGENT_TASK_STATUS_FAILED = 3;
  AGENT_TASK_STATUS_STOPPED = 4;
}

// A subagent (Claude's Agent tool) tracked live.
message AgentTask {
  string id = 1;
  // The tool call that spawned it (matches a transcript item id).
  string tool_use_id = 2;
  string description = 3;
  string subagent_type = 4;
  string prompt = 5;
  bool is_background = 6;
  AgentTaskStatus status = 7;
  int64 started_at_ms = 8;
  int64 ended_at_ms = 9;
  int32 tool_uses = 10;
  int64 total_tokens = 11;
  string activity = 12;
  repeated AgentTaskStep steps = 13;
  string output = 14;
  string summary = 15;
}

message AgentTaskStep {
  string name = 1;
  string summary = 2;
}

message RateLimit {
  // The most-used window (kept for simple clients): 0..1 of the window used.
  double used_fraction = 1;
  // "5-hour", "Weekly", ...
  string window = 2;
  int64 resets_at_ms = 3;
  // Every window this update reported. Updates can be partial; merge by window id.
  repeated RateLimitWindow windows = 4;
  // Claude: currently drawing on extra usage / overage credits.
  bool using_overage = 5;
  // Claude: overage availability ("allowed", "rejected", ...) and why it's unavailable.
  string overage_status = 6;
  string overage_disabled_reason = 7;
  // Codex: plan name, when reported.
  string plan = 8;
}

message RateLimitWindow {
  // Stable key ("five_hour", "seven_day_opus", "primary", ...).
  string id = 1;
  // "Current session", "Weekly", "Weekly · Opus", ...
  string label = 2;
  // "5 hours", "7 days", when known.
  string duration = 3;
  double used_fraction = 4;
  int64 resets_at_ms = 5;
  // "allowed", "allowed_warning", "rejected".
  string status = 6;
}

// ---------------------------------------------------------------------------------------------
// Code
// ---------------------------------------------------------------------------------------------

message GetDiff {
  string workspace_id = 1;
  // Optional: only this file.
  string path = 2;
}

message Diff {
  // The merge base the diff is against.
  string base = 1;
  repeated FileDiff files = 2;
  int32 ahead = 3;
  int32 behind = 4;
}

enum FileDiffStatus {
  FILE_DIFF_STATUS_UNSPECIFIED = 0;
  FILE_DIFF_STATUS_ADDED = 1;
  FILE_DIFF_STATUS_MODIFIED = 2;
  FILE_DIFF_STATUS_DELETED = 3;
  FILE_DIFF_STATUS_RENAMED = 4;
}

message FileDiff {
  string path = 1;
  string old_path = 2;
  FileDiffStatus status = 3;
  int32 additions = 4;
  int32 deletions = 5;
  // Unified diff text for this file. Empty in a whole-workspace listing when the file is binary.
  string patch = 6;
  bool binary = 7;
}

message ListFiles {
  string workspace_id = 1;
}

message FileList {
  // Paths relative to the workspace root, tracked and untracked (excluding ignored).
  repeated string paths = 1;
}

message ReadFile {
  string workspace_id = 1;
  // Relative to the workspace root.
  string path = 2;
  // 0 = server default (2 MB).
  int64 max_bytes = 3;
}

message FileContent {
  string path = 1;
  bytes data = 2;
  int64 size = 3;
}

// ---------------------------------------------------------------------------------------------
// Tokens
// ---------------------------------------------------------------------------------------------

enum TokenScope {
  TOKEN_SCOPE_UNSPECIFIED = 0;
  // Watch only.
  TOKEN_SCOPE_READ = 1;
  // Create workspaces, prompt, answer approvals, ship. No file reads or terminals.
  TOKEN_SCOPE_TRIGGER = 2;
  // Normal app use.
  TOKEN_SCOPE_OPERATE = 3;
  // Everything, including tokens.
  TOKEN_SCOPE_ADMIN = 4;
}

message CreateToken {
  string name = 1;
  TokenScope scope = 2;
}

message CreatedToken {
  TokenInfo info = 1;
  // Shown once. Only a hash is stored.
  string secret = 2;
}

message ListTokens {}

message TokenList {
  repeated TokenInfo tokens = 1;
}

message TokenInfo {
  string id = 1;
  string name = 2;
  TokenScope scope = 3;
  int64 created_at_ms = 4;
  int64 last_used_at_ms = 5;
}

message RevokeToken {
  string token_id = 1;
}

// ---------------------------------------------------------------------------------------------
// Sandboxes
//
// A server owns its sandbox providers: accounts on a sandbox service (boat.dev) with their API
// key and defaults. Keys stay on the server; clients ask it to create, resume, stop and open
// sandboxes. Providers come from server.toml (read-only here) or are saved over the Domestique protocol.
//
// Scopes: listing and reading are READ; creating, resuming, stopping, renaming and auto-stop are
// TRIGGER; deleting, recovering and opening access (SSH keys, desktop, port URLs) are OPERATE;
// saving and removing providers is ADMIN.
// ---------------------------------------------------------------------------------------------

enum SandboxKind {
  SANDBOX_KIND_UNSPECIFIED = 0;
  SANDBOX_KIND_BOAT = 1;
}

message SandboxProvider {
  // A UUID, chosen by whoever creates the provider.
  string id = 1;
  SandboxKind kind = 2;
  string name = 3;
  SandboxDefaults defaults = 4;
  // Where the API key comes from. Never the key itself.
  SandboxCredentialSource credential_source = 5;
  // Declared in server.toml: SaveSandboxProvider and RemoveSandboxProvider refuse it.
  bool from_config = 6;
  // Filled in by ListSandboxProviders{check_account}.
  SandboxAccount account = 7;
}

enum SandboxCredentialSource {
  SANDBOX_CREDENTIAL_SOURCE_UNSPECIFIED = 0;
  // No key: the provider can't be used until one is saved.
  SANDBOX_CREDENTIAL_SOURCE_NONE = 1;
  // Saved with SaveSandboxProvider (in the server's database).
  SANDBOX_CREDENTIAL_SOURCE_STORED = 2;
  // server.toml's api_key_env / api_key_file.
  SANDBOX_CREDENTIAL_SOURCE_CONFIG = 3;
  // BOAT_API_KEY in the server's environment.
  SANDBOX_CREDENTIAL_SOURCE_ENVIRONMENT = 4;
  // The `boat login` session of the server's user.
  SANDBOX_CREDENTIAL_SOURCE_CLI = 5;
}

message SandboxDefaults {
  // boat: small / default / large / xlarge. Empty = the service default.
  string machine_type = 1;
  // Auto-stop this long after a start or resume. Unset = never.
  optional uint32 auto_stop_minutes = 2;
  // boat environment name (repositories, secrets, AI credentials). Empty = the account default.
  string environment = 3;
  // boat saved snapshot to start from. Empty = a fresh machine.
  string from_snapshot = 4;
  // Archiving a workspace deletes its sandbox instead of stopping it.
  bool delete_on_archive = 5;
}

message SandboxAccount {
  string login = 1;
  string email = 2;
  string display_name = 3;
  // Set when the account couldn't be read (bad key, network).
  string error = 4;
  bool can_start = 5;
  string start_blocked_reason = 6;
  // e.g. "Trial: 3 days left".
  string trial_line = 7;
  repeated SandboxMachineType machine_types = 8;
}

message SandboxMachineType {
  string type = 1;
  bool available = 2;
  string reason = 3;
}

message SandboxProviderList {
  repeated SandboxProvider providers = 1;
}

message ListSandboxProviders {
  // Also read each provider's account and limits (one API call each).
  bool check_account = 1;
}

// Creates or replaces a provider (ADMIN).
message SaveSandboxProvider {
  SandboxProvider provider = 1;
  // Set: replace the stored key ("" deletes it). Unset: keep the stored key.
  optional string api_key = 2;
}

message RemoveSandboxProvider {
  string provider_id = 1;
}

enum SandboxPhase {
  SANDBOX_PHASE_UNSPECIFIED = 0;
  SANDBOX_PHASE_STARTING = 1;
  SANDBOX_PHASE_RUNNING = 2;
  SANDBOX_PHASE_STOPPING = 3;
  SANDBOX_PHASE_STOPPED = 4;
  SANDBOX_PHASE_ERROR = 5;
  SANDBOX_PHASE_GONE = 6;
}

message Sandbox {
  // The service's id (boat: bx_...).
  string id = 1;
  string provider_id = 2;
  string name = 3;
  // The service's own state string; `phase` is the normalised one.
  string state = 4;
  SandboxPhase phase = 5;
  string error = 6;
  string machine_type = 7;
  int32 vcpu = 8;
  int32 memory_gb = 9;
  string ip = 10;
  // host:port to SSH to, when it isn't ip:22.
  string ssh_endpoint = 11;
  string url = 12;
  optional bool desktop_available = 13;
  // When an idle stopped sandbox is archived. 0 = unknown.
  int64 archive_after_ms = 14;
  // Auto-stop window. Unset = never.
  optional int32 ttl_seconds = 15;
  string health = 16;
  string health_reason = 17;
  optional bool hydrated = 18;
  int64 created_at_ms = 19;
  int64 stopped_at_ms = 20;
  string environment = 21;
}

message SandboxList {
  repeated Sandbox sandboxes = 1;
}

message ListSandboxes {
  string provider_id = 1;
}

message GetSandbox {
  string provider_id = 1;
  string sandbox_id = 2;
}

// Starts a sandbox and returns it straight away (usually STARTING). Pass Request.idempotency_key:
// it is also sent to the service, so a retried create never makes two machines.
message CreateSandbox {
  string provider_id = 1;
  string name = 2;
  // Each empty / unset field falls back to the provider's defaults.
  string machine_type = 3;
  optional uint32 auto_stop_minutes = 4;
  // Overrides the provider's auto_stop_minutes: never auto-stop.
  bool disable_auto_stop = 5;
  string environment = 6;
  string from_snapshot = 7;
  map<string, string> labels = 8;
}

enum SandboxAction {
  SANDBOX_ACTION_UNSPECIFIED = 0;
  // ttl_seconds: unset keeps the sandbox's auto-stop setting.
  SANDBOX_ACTION_RESUME = 1;
  SANDBOX_ACTION_STOP = 2;
  // ttl_seconds: the new auto-stop window from now; unset turns auto-stop off.
  SANDBOX_ACTION_SET_AUTO_STOP = 3;
  SANDBOX_ACTION_RENAME = 4;
  // Permanent: the sandbox and its snapshots.
  SANDBOX_ACTION_DELETE = 5;
  SANDBOX_ACTION_RECOVER = 6;
}

message ChangeSandbox {
  string provider_id = 1;
  string sandbox_id = 2;
  SandboxAction action = 3;
  optional int32 ttl_seconds = 4;
  // RENAME.
  string name = 5;
}

message OpenSandboxAccess {
  string provider_id = 1;
  string sandbox_id = 2;
  oneof kind {
    // Authorize this OpenSSH public key; the answer says where to connect and which host key to pin.
    string ssh_public_key = 3;
    DesktopAccess desktop = 4;
    PortAccess port = 5;
  }
}

message DesktopAccess {
  // Unset = the service default theme.
  optional bool dark = 1;
}

message PortAccess {
  uint32 port = 1;
  // Public URLs need no token; private ones carry one.
  bool public = 2;
  string title = 3;
}

message SandboxAccess {
  // ssh_public_key.
  string ssh_user = 1;
  string machine_ip = 2;
  string ssh_endpoint = 3;
  string host_key = 4;
  // desktop / port: a secret-bearing URL.
  string url = 5;
}

// ---------------------------------------------------------------------------------------------
// MCP servers: kept in the server's database with their secrets, so they work on a server with no
// Keychain. Boat rewrites Claude's own config inside a sandbox, so clients write ResolveMcpConfig's
// JSON to a file of ours on the sandbox and start claude with --mcp-config.
//
// Listing and resolving are OPERATE (the same as getting SSH access to a sandbox, which is where
// the secrets end up); saving and removing are ADMIN.
// ---------------------------------------------------------------------------------------------

enum McpTransport {
  MCP_TRANSPORT_UNSPECIFIED = 0;
  // A command the agent starts on the machine it runs on.
  MCP_TRANSPORT_STDIO = 1;
  MCP_TRANSPORT_HTTP = 2;
  MCP_TRANSPORT_SSE = 3;
}

message McpServer {
  // A UUID, chosen by whoever creates the server.
  string id = 1;
  // The name the agent knows it by: letters, digits, "-" and "_". Unique on a server.
  string name = 2;
  McpTransport transport = 3;
  // STDIO only.
  string command = 4;
  repeated string args = 5;
  // HTTP and SSE only.
  string url = 6;
  // Off: stored, but not given to agents.
  bool enabled = 7;
  // Also give it to agents in this server's worktrees, not only to sandboxes.
  bool everywhere = 8;
  // Output only. Which secrets are stored; the values never leave except through ResolveMcpConfig.
  repeated string env_names = 9;
  repeated string header_names = 10;
}

message McpServerList {
  repeated McpServer servers = 1;
}

message ListMcpServers {}

// Creates or replaces a server (ADMIN). Secrets not named here keep their stored values.
message SaveMcpServer {
  McpServer server = 1;
  map<string, string> set_env = 2;
  map<string, string> set_headers = 3;
  repeated string remove_env = 4;
  repeated string remove_headers = 5;
}

message RemoveMcpServer {
  string server_id = 1;
}

// Every enabled server, secrets included, as a Claude Code --mcp-config file.
message ResolveMcpConfig {}

message McpConfig {
  // {"mcpServers": {...}}
  string json = 1;
  uint32 server_count = 2;
}
