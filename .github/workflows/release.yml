name: Build & release

# Every push to the default branch builds Domestique.app and publishes it as a GitHub Release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# No workflow-level concurrency: each job has its own group so that a new push cancels an older run
# while it's still building, but never interrupts one that's already publishing.

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    # A newer push supersedes this one: cancel any in-flight build and only build the latest commit.
    concurrency:
      group: release-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Actions are pinned to commits: this workflow publishes releases, and every install auto-updates from them.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # full history + tags, for the changelog since the previous build

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build Domestique.app
        run: |
          xcodebuild -project Domestique.xcodeproj -scheme Domestique -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: teamcar/go.mod
          cache-dependency-path: teamcar/go.sum

      - name: Package
        run: |
          APP=build/DerivedData/Build/Products/Release/Domestique.app
          scripts/build-teamcar.sh "$APP"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Domestique.zip
          shasum -a 256 Domestique.zip | tee Domestique.zip.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Domestique
          path: |
            Domestique.zip
            Domestique.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishing is never cancelled part-way (that could leave a tag without assets). If another publish
    # is running, this one waits; GitHub keeps only the newest waiting run, so the latest build still wins.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # full history + tags, for the changelog since the previous build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: Domestique

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          SHORT="$(git rev-parse --short HEAD)"
          # The release title is what the in-app updater shows as the update's headline, so use the commit
          # subject (the squashed PR title). The build number lives in the tag.
          SUBJECT="$(git log -1 --format=%s)"
          PREV="$(git describe --tags --abbrev=0 --match 'build-*' HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log --no-merges --format='- %s (%h)' "$PREV..HEAD")"
          else
            CHANGES="$(git log -1 --format='- %s (%h)')"
          fi
          cat > notes.md <<NOTES
          ## What's changed
          ${CHANGES}

          Build ${{ github.run_number }} of \`${SHORT}\`.

          **Install:** download \`Domestique.zip\`, unzip, and move \`Domestique.app\` to /Applications.
          This build is ad-hoc signed (not notarized), so the first time run:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Domestique.app
          \`\`\`

          After that, Domestique updates itself: a button appears at the bottom of the sidebar when a new build is out.
          NOTES
          gh release create "$TAG" Domestique.zip Domestique.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "$SUBJECT" \
            --notes-file notes.md \
            --latest
