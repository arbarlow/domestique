name: Build & release

# Every push to the default branch builds Domestique.app and publishes it as a GitHub Release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build Domestique.app
        run: |
          xcodebuild -project Domestique.xcodeproj -scheme Domestique -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package
        run: |
          APP=build/DerivedData/Build/Products/Release/Domestique.app
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Domestique.zip
          shasum -a 256 Domestique.zip | tee Domestique.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          SHORT="$(git rev-parse --short HEAD)"
          SUBJECT="$(git log -1 --format=%s)"
          cat > notes.md <<NOTES
          Automatic build of \`${SHORT}\`: ${SUBJECT}

          **Install:** download \`Domestique.zip\`, unzip, and move \`Domestique.app\` to /Applications.
          This build is ad-hoc signed (not notarized), so the first time run:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Domestique.app
          \`\`\`
          NOTES
          gh release create "$TAG" Domestique.zip Domestique.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Domestique build ${{ github.run_number }} (${SHORT})" \
            --notes-file notes.md \
            --latest
