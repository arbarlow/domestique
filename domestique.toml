# domestique.toml: Domestique, developed in Domestique.
#
# ⌘R runs this branch's build of the app. It shares your real data (same SQLite database as
# your installed Domestique, which is built to handle several instances at once).
# Use "Run (sandboxed data)" to try a branch against a throwaway database instead.

[setup]
# Warm the build so the first ⌘R is quick. Runs once when a workspace is created.
script = "swift build --product DomestiqueDev"

[tasks.app]
name = "Domestique (this branch)"
# Builds this branch's server first; the app starts it (or reuses one already running).
command = "go -C server build -o domestique ./cmd/domestique && swift run DomestiqueDev"
ready_pattern = "Build of product 'DomestiqueDev' complete|Build complete!"

[tasks.app-sandboxed]
name = "Run (sandboxed data)"
# Fresh database, settings, SSH key, worktrees and its own server under .dq-dev/ in this workspace.
command = "mkdir -p .dq-dev/home .dq-dev/workspaces && go -C server build -o domestique ./cmd/domestique && swift run DomestiqueDev"
env = { DOMESTIQUE_HOME = "$DOMESTIQUE_WORKSPACE_PATH/.dq-dev/home", DOMESTIQUE_WORKSPACES = "$DOMESTIQUE_WORKSPACE_PATH/.dq-dev/workspaces", DOMESTIQUE_SERVER_HOME = "$DOMESTIQUE_WORKSPACE_PATH/.dq-dev/app-server", DOMESTIQUE_SERVER_WORKSPACES_ROOT = "$DOMESTIQUE_WORKSPACE_PATH/.dq-dev/workspaces", DOMESTIQUE_SERVER_REPOS_ROOT = "$DOMESTIQUE_WORKSPACE_PATH/.dq-dev/repos" }
ready_pattern = "Build of product 'DomestiqueDev' complete|Build complete!"

[tasks.bundle]
name = "Build & open .app"
# The real app bundle (icon, Dock name), Debug config, from the Xcode project.
command = "scripts/build-app.sh Debug && open build/Domestique.app"
kind = "oneshot"

[tasks.ios]
name = "iPhone app (Simulator)"
# Builds the iPhone app, installs it on a booted iPhone simulator and launches it. Point it at this
# workspace's server (the "server" task) with ws://127.0.0.1:$DOMESTIQUE_PORT and a token.
command = "xcodebuild -project Domestique.xcodeproj -scheme DomestiqueiOS -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData-iOS -skipPackagePluginValidation -skipMacroValidation -quiet build && xcrun simctl install booted build/DerivedData-iOS/Build/Products/Debug-iphonesimulator/DomestiqueiOS.app && xcrun simctl launch --terminate-running-process booted cc.alexb.domestique.ios"
kind = "oneshot"

[tasks.test]
name = "Tests"
command = "swift build && swift test"
kind = "oneshot"

[tasks.server]
name = "server"
# This branch's server with throwaway state (database, worktrees, clones) under .dq-dev/server: Unix socket there, plus TCP on
# this workspace's port (token required; create one with the "Server token" task).
command = "cd server && go run ./cmd/domestique serve --name \"domestique-$DOMESTIQUE_WORKSPACE\" --listen \"unix://$DOMESTIQUE_SERVER_HOME/server.sock\" --listen tcp://127.0.0.1:$DOMESTIQUE_PORT"
env = { DOMESTIQUE_SERVER_HOME = "$DOMESTIQUE_WORKSPACE_PATH/.dq-dev/server", DOMESTIQUE_SERVER_WORKSPACES_ROOT = "$DOMESTIQUE_WORKSPACE_PATH/.dq-dev/server/workspaces", DOMESTIQUE_SERVER_REPOS_ROOT = "$DOMESTIQUE_WORKSPACE_PATH/.dq-dev/server/repos" }
ready_pattern = "server ready"

[tasks.server-token]
name = "Server token"
command = "cd server && go run ./cmd/domestique token create --name dev --scope admin"
env = { DOMESTIQUE_SERVER_HOME = "$DOMESTIQUE_WORKSPACE_PATH/.dq-dev/server" }
kind = "oneshot"

[tasks.server-test]
name = "Server tests"
command = "cd proto && buf lint && cd ../server && go vet ./... && go test -race ./..."
kind = "oneshot"

[stacks.dev]
name = "Run this branch"
tasks = ["app"]

[stacks.server]
name = "Server"
tasks = ["server"]

[trunk]
gate = ["test", "server-test"]
